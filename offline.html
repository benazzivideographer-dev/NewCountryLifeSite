<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sei offline – CountryLife</title>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #1B1B1B; --orange: #D96C2D; --white: #F7F5F2; --beige: #E8DCC8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--black); color: var(--white); text-align: center; padding: 24px;
      font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    }
    .box { max-width: 380px; }
    .mark {
      width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 20px;
      background: var(--black); border: 3px solid var(--beige);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 10px rgba(232,220,200,.08);
    }
    .mark::after { content: ""; width: 34px; height: 34px; border-radius: 50%; background: var(--orange); }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.9rem; margin: 0 0 12px; }
    p { line-height: 1.65; color: rgba(247,245,242,.72); margin: 0 0 28px; font-size: .95rem; }
    a.btn {
      display: inline-block; background: var(--orange); color: #fff; text-decoration: none;
      padding: 13px 30px; border-radius: 999px; font-weight: 600; font-size: .95rem;
      border: 0; cursor: pointer; font-family: inherit;
    }
    a.btn:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"></div>
    <h1>Sei offline</h1>
    <p>
      Non c'è connessione e questa pagina non era ancora stata salvata sul tuo telefono.
      Le pagine che hai già visitato restano disponibili.
    </p>
    <a class="btn" href="/app/" onclick="if(navigator.onLine){location.href='/app/';}return false;">Riprova</a>
  </div>
  <script>
    // Se la connessione torna, ricarica da solo senza toccare nulla
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
